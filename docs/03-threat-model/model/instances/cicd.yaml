    transport: { network_protocol: unknown, ports: [] }
    direction: outbound
    authentication: { required: false, mechanisms: [] }
    authorization: { required: false, mechanisms: [] }
    security_requirements: { confidentiality: low, integrity: high, availability: moderate }
    state: planned
