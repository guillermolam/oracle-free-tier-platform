  - id: FLOW-CICD-APPLY-TO-DRIFT
    name: Controlled apply to drift detection
    source_ref: COMP-CONTROLLED-APPLY
    destination_ref: COMP-DRIFT-DETECTION
    description: PLANNED, I23.
    transport: { network_protocol: unknown, ports: [] }
    direction: outbound
