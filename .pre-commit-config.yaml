repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(infrastructure/live|infrastructure/compositions)/
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
        args: ["--hook-config=--tf-path=tofu"]
      - id: terraform_validate
        exclude: ^infrastructure/live/
        args: ["--hook-config=--tf-path=tofu"]
      - id: terraform_tflint
      - id: checkov
        # CKV_OCI_9/16/19: see .github/workflows/validate.yml's checkov step
        # and infrastructure/modules/foundation/state_backend.tf /
        # infrastructure/modules/network/security_lists.tf's comments --
        # kept in sync with that workflow's skip_check so local pre-commit
        # and CI agree.
        args: ["--skip-check=CKV_OCI_9,CKV_OCI_16,CKV_OCI_19"]
  - repo: local
    hooks:
      - id: check-gpg-signing
        name: GPG commit-signing configuration
        entry: scripts/check-gpg-signing.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: check-gpg-signing-test
        name: GPG commit-signing checker self-test
        entry: scripts/check-gpg-signing.test.sh
        language: system
        files: '^scripts/check-gpg-signing(\.test)?\.sh$'
        pass_filenames: false
        stages: [pre-commit]
      - id: mermaid-validate
        name: Mermaid diagram validation (mmdc)
        entry: scripts/validate-mermaid.sh
        language: system
        files: '\.mmd$'
        pass_filenames: true
      - id: threat-model-validate
        name: Threat-model corpus validation (schema + referential integrity)
        entry: scripts/validate-threat-model.mjs
        language: system
        files: '^docs/03-threat-model/model/'
        pass_filenames: false
      - id: threat-model-validator-test
        name: Threat-model validator self-test
        entry: scripts/validate-threat-model.test.mjs
        language: system
        files: '^scripts/validate-threat-model(\.test)?\.mjs$'
        pass_filenames: false
      - id: terragrunt-hclfmt
        name: Terragrunt HCL format check
        entry: bash -c 'cd infrastructure/live && terragrunt hcl fmt --check'
        language: system
        files: '^infrastructure/live/.*\.hcl$'
        pass_filenames: false
      - id: check-dco
        name: Developer Certificate of Origin (Signed-off-by)
        entry: .githooks/commit-msg
        language: system
        stages: [commit-msg]
      - id: claude-settings-permissions
        name: Claude Code settings.json permission-boundary check
        entry: .claude/tests/settings-permissions.test.sh
        language: system
        files: '^\.claude/(settings\.json|hooks/block-destructive-commands\.sh|tests/settings-permissions\.test\.sh|tests/fixtures/settings-.*\.json)$'
        pass_filenames: false
      - id: claude-hooks-selftest
        name: Claude Code hooks self-tests
        entry: bash -c 'status=0; for t in .claude/hooks/*.test.sh; do "$t" || status=1; done; exit $status'
        language: system
        files: '^\.claude/hooks/'
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: detect-private-key
        stages: [pre-commit]
  # --- any change under .github/: fmt -> lint -> security -> act -----------
  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # frozen: v0.21.0
    hooks:
      - id: yamlfmt
        name: "gh actions 1/4: fmt (yamlfmt)"
        files: ^\.github/.*\.ya?ml$
        stages: [pre-commit]
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
        name: "gh actions 2/4: lint (actionlint)"
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: act-validate
        name: "gh actions 2/4: lint (act --validate)"
        entry: act --validate
        language: system
        files: ^\.github/
        pass_filenames: false
        stages: [pre-commit]
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # frozen: v1.31.1
    hooks:
      - id: zizmor
        name: "gh actions 3/4: security (zizmor)"
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: act-dryrun
        name: "gh actions 4/4: act dry run"
        entry: act --dryrun push
        language: system
        files: ^\.github/
        pass_filenames: false
        stages: [pre-commit]
  # --- secret scanning -------------------------------------------------------
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --staged --redact --no-banner --config .gitleaks.toml
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: trufflehog
        name: trufflehog (staged files)
        entry: .github/scripts/trufflehog-scan.sh files
        language: system
        stages: [pre-commit]
      - id: gitleaks-push
        name: gitleaks (commits being pushed)
        entry: bash -c 'gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="${PRE_COMMIT_TO_REF:-HEAD} --not --remotes"'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: trufflehog-history
        name: trufflehog (full history)
        entry: .github/scripts/trufflehog-scan.sh history
        language: system
        pass_filenames: false
        stages: [pre-push]
default_install_hook_types:
  - pre-commit
  - pre-push
