repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(infrastructure/live|infrastructure/compositions)/
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
        args: ["--hook-config=--tf-path=tofu"]
      - id: terraform_validate
        exclude: ^infrastructure/live/
        args: ["--hook-config=--tf-path=tofu"]
      - id: terraform_tflint
      - id: checkov

  - repo: local
    hooks:
      - id: check-gpg-signing
        name: GPG commit-signing configuration
        entry: scripts/check-gpg-signing.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: mermaid-validate
        name: Mermaid diagram validation (mmdc)
        entry: scripts/validate-mermaid.sh
        language: system
        files: '\.mmd$'
        pass_filenames: true

      - id: check-dco
        name: Developer Certificate of Origin (Signed-off-by)
        entry: .githooks/commit-msg
        language: system
        stages: [commit-msg]
