repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(infrastructure/live|infrastructure/compositions)/
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      # .claude/skills/new-tofu-module/templates/ holds HCL *templates* for
      # scaffolding a module, not a configuration anyone applies. They are
      # kept syntactically valid so `tofu fmt` stays clean over them, but
      # they must not be init'd, validated, linted, or policy-scanned as if
      # they were real infrastructure.
      - id: terraform_fmt
        args: ["--hook-config=--tf-path=tofu"]
      - id: terraform_validate
        exclude: ^(infrastructure/live/|\.claude/)
        args: ["--hook-config=--tf-path=tofu"]
      - id: terraform_tflint
        exclude: ^\.claude/
      - id: checkov
        exclude: ^\.claude/
        # CKV_OCI_9/16/19: see .github/workflows/validate.yml's checkov step
        # and infrastructure/modules/foundation/state_backend.tf /
        # infrastructure/modules/network/security_lists.tf's comments --
        # kept in sync with that workflow's skip_check so local pre-commit
        # and CI agree.
        args: ["--skip-check=CKV_OCI_9,CKV_OCI_16,CKV_OCI_19"]

  - repo: local
    hooks:
      - id: check-gpg-signing
        name: GPG commit-signing configuration
        entry: scripts/check-gpg-signing.sh
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: check-gpg-signing-test
        name: GPG commit-signing checker self-test
        entry: scripts/check-gpg-signing.test.sh
        language: system
        files: '^scripts/check-gpg-signing(\.test)?\.sh$'
        pass_filenames: false
        stages: [pre-commit]

      - id: mermaid-validate
        name: Mermaid diagram validation (mmdc)
        entry: scripts/validate-mermaid.sh
        language: system
        files: '\.mmd$'
        pass_filenames: true

      - id: threat-model-validate
        name: Threat-model corpus validation (schema + referential integrity)
        entry: scripts/validate-threat-model.mjs
        language: system
        files: '^docs/03-threat-model/model/'
        pass_filenames: false

      - id: threat-model-validator-test
        name: Threat-model validator self-test
        entry: scripts/validate-threat-model.test.mjs
        language: system
        files: '^scripts/validate-threat-model(\.test)?\.mjs$'
        pass_filenames: false

      - id: terragrunt-hclfmt
        name: Terragrunt HCL format check
        entry: bash -c 'cd infrastructure/live && terragrunt hcl fmt --check'
        language: system
        files: '^infrastructure/live/.*\.hcl$'
        pass_filenames: false

      - id: check-dco
        name: Developer Certificate of Origin (Signed-off-by)
        entry: .githooks/commit-msg
        language: system
        stages: [commit-msg]

      - id: claude-settings-permissions
        name: Claude Code settings.json permission-boundary check
        entry: .claude/tests/settings-permissions.test.sh
        language: system
        files: '^\.claude/(settings\.json|hooks/block-destructive-commands\.sh|tests/settings-permissions\.test\.sh|tests/fixtures/settings-.*\.json)$'
        pass_filenames: false

      - id: claude-hooks-selftest
        name: Claude Code hooks self-tests
        entry: bash -c 'status=0; for t in .claude/hooks/*.test.sh; do "$t" || status=1; done; exit $status'
        language: system
        files: '^\.claude/hooks/'
        pass_filenames: false

      - id: helm-charts-validate
        name: Helm chart validation (lint / template / pinned appVersion)
        entry: scripts/validate-helm-charts.sh
        language: system
        files: '^helm-charts/'
        pass_filenames: false

      - id: helm-charts-validator-test
        name: Helm chart validator self-test
        entry: scripts/validate-helm-charts.test.sh
        language: system
        files: '^scripts/validate-helm-charts(\.test)?\.sh$'
        pass_filenames: false

      - id: kyverno-policies-validate
        name: Kyverno policy validation (structure + ADR-0004 boundary)
        entry: scripts/validate-kyverno-policies.mjs
        language: system
        files: '^platform/kyverno-policies/'
        pass_filenames: false

      - id: kyverno-policies-validator-test
        name: Kyverno policy validator self-test
        entry: scripts/validate-kyverno-policies.test.mjs
        language: system
        files: '^scripts/validate-kyverno-policies(\.test)?\.mjs$'
        pass_filenames: false

      # shfmt is deliberately NOT wired in here (or in shell.yml), even
      # though .trunk/trunk.yaml enables it: running it over the existing
      # scripts produces a ~4.5k-line whole-repo reformat, mostly collapsing
      # the double-space alignment this repo uses before `||`. Adopting it
      # is a one-time reformat commit someone has to decide to make, not a
      # gate to switch on underneath existing work.
      - id: shellcheck
        name: ShellCheck
        # --severity=warning mirrors .github/workflows/shell.yml exactly --
        # if these two drift, a commit that passes locally fails in CI.
        entry: shellcheck --external-sources --severity=warning
        language: system
        types: [shell]
        files: '\.sh$|^\.githooks/'
