apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ziti-controller
  namespace: openziti
spec:
  interval: 30m0s
  releaseName: ziti-controller
  chart:
    spec:
      chart: ziti-controller
      version: 3.2.1
      sourceRef:
        kind: HelmRepository
        name: openziti
        namespace: flux-system
      interval: 1h0m0s
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
    - name: dex
      namespace: dex
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: openziti-controller-values
      valuesKey: values.yaml
