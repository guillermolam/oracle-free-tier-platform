apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: argocd-values
    namespace: argocd
    files:
      - values.yaml=values.yaml
resources:
  - helmrelease.yaml
