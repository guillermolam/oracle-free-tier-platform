apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 30m0s
  releaseName: argocd
  chart:
    spec:
      chart: argo-cd
      version: 10.4.0
      sourceRef:
        kind: HelmRepository
        name: argo-cd
        namespace: flux-system
      interval: 1h0m0s
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: argocd-values
      valuesKey: values.yaml
