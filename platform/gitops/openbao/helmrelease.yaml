apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 30m0s
  releaseName: openbao
  chart:
    spec:
      chart: openbao
      version: 0.29.2
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
      interval: 1h0m0s
  dependsOn:
    - name: dex
      namespace: dex
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: openbao-values
      valuesKey: values.yaml
