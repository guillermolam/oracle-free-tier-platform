image:
  repository: ghcr.io/dexidp/dex

config:
  issuer: https://auth.platform.lamcloud.net
  storage:
    type: kubernetes
    config:
      inCluster: true
  web:
    http: 0.0.0.0:5556
  telemetry:
    http: 0.0.0.0:5558
  oauth2:
    skipApprovalScreen: true
  enablePasswordDB: false
  connectors:
    - type: github
      id: github
      name: GitHub
      config:
        clientID: ${GITHUB_CLIENT_ID}
        clientSecret: ${GITHUB_CLIENT_SECRET}
        redirectURI: https://auth.platform.lamcloud.net/callback
        orgs:
          - name: Lam-Cloud-Security-LLC
  staticClients:
    - id: kubernetes
      name: Kubernetes
      public: true
      redirectURIs:
        - http://localhost:8000
    - id: openziti
      name: OpenZiti
      public: true
      redirectURIs:
        - http://localhost:20314/auth/callback
    - id: worker-wake
      name: Worker Wake
      public: true
      redirectURIs:
        - http://localhost:8000

envVars:
  - name: DEX_EXPAND_ENV
    value: "true"
  - name: GITHUB_CLIENT_ID
    valueFrom:
      secretKeyRef:
        name: dex-github-connector
        key: client-id
  - name: GITHUB_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: dex-github-connector
        key: client-secret

service:
  type: ClusterIP

ingress:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
