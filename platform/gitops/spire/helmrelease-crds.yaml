apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire-crds
  namespace: spire-system
spec:
  interval: 30m0s
  releaseName: spire-crds
  chart:
    spec:
      chart: spire-crds
      version: 0.6.0
      sourceRef:
        kind: HelmRepository
        name: spire
        namespace: flux-system
      interval: 1h0m0s
  dependsOn:
    - name: dex
      namespace: dex
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
