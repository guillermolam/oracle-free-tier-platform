apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: spire-values
    namespace: spire-server
    files:
      - values.yaml=values.yaml
resources:
  - helmrelease-crds.yaml
  - helmrelease.yaml
