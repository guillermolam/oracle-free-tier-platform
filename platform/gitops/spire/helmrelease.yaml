apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: spire
  namespace: spire-server
spec:
  interval: 30m0s
  releaseName: spire
  chart:
    spec:
      chart: spire
      version: 0.30.0
      sourceRef:
        kind: HelmRepository
        name: spire
        namespace: flux-system
      interval: 1h0m0s
  dependsOn:
    - name: spire-crds
      namespace: spire-system
    - name: dex
      namespace: dex
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: spire-values
      valuesKey: values.yaml
