name: deploy-infrastructure

on:
  push:
    branches: ["main"]  # Only deploy from main
    paths:
      - "infrastructure/**"
  workflow_dispatch:    # Emergency manual deployment

permissions:
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: deploy-infrastructure
  cancel-in-progress: false  # Never cancel infrastructure deployments

env:
  TF_IN_AUTOMATION: true
  TF_CLI_ARGS: "-no-color"

jobs:
  validate-and-plan:
    name: Pre-Deploy Validation & Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/live/oci/eu-madrid-1/lab
    outputs:
      plan_result: ${{ steps.plan.outputs.plan_result }}
      destructive: ${{ steps.plan.outputs.destructive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt_version: "0.58.7"

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.x"
          cache: true

      - name: Security Scan (Final Check)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure
          config_file: .checkov.yaml
          soft_fail: false  # Block deployment on security issues

      - name: Generate Deployment Plan
        id: plan
        run: |
          set -euo pipefail

          echo "🔍 Generating final deployment plan..."
          ../../scripts/tg plan -out=deploy.tfplan -detailed-exitcode || plan_exit=$?

          case ${plan_exit:-0} in
            0)
              echo "plan_result=no-changes" >> $GITHUB_OUTPUT
              echo "No infrastructure changes to deploy"
              ;;
            2)
              echo "plan_result=has-changes" >> $GITHUB_OUTPUT

              # Analyze for destructive changes
              ../../scripts/tg show -json deploy.tfplan > deploy_plan.json
              to_destroy=$(jq -r '.resource_changes | map(select(.change.actions == ["delete"])) | length' deploy_plan.json)

              if [ "$to_destroy" -gt 0 ]; then
                echo "destructive=true" >> $GITHUB_OUTPUT
                echo "⚠️ DESTRUCTIVE: $to_destroy resources will be destroyed"
              else
                echo "destructive=false" >> $GITHUB_OUTPUT
              fi
              ;;
            *)
              echo "❌ Plan generation failed"
              exit ${plan_exit}
              ;;
          esac

      - name: Save Deployment Plan
        if: steps.plan.outputs.plan_result == 'has-changes'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-plan-${{ github.run_id }}
          path: |
            infrastructure/live/oci/eu-madrid-1/lab/deploy.tfplan
            infrastructure/live/oci/eu-madrid-1/lab/deploy_plan.json

  deploy-infrastructure:
    name: Deploy to OCI Always Free Tier
    runs-on: ubuntu-latest
    needs: validate-and-plan
    if: needs.validate-and-plan.outputs.plan_result == 'has-changes'

    # 🛡️ MANUAL APPROVAL REQUIRED
    environment:
      name: oci-lab-production
      url: ${{ steps.deploy.outputs.oci_console_url }}

    defaults:
      run:
        working-directory: infrastructure/live/oci/eu-madrid-1/lab

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt_version: "0.58.7"

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.x"
          cache: true

      - name: Download Deployment Plan
        uses: actions/download-artifact@v4
        with:
          name: deployment-plan-${{ github.run_id }}
          path: infrastructure/live/oci/eu-madrid-1/lab/

      - name: Pre-Deploy State Check
        run: |
          echo "🔍 Verifying state consistency..."
          ../../scripts/tg refresh

          # Verify plan is still valid
          echo "🔍 Re-validating deployment plan..."
          ../../scripts/tg plan -detailed-exitcode deploy.tfplan || {
            echo "❌ Plan validation failed - infrastructure may have changed"
            echo "Please re-run the workflow to generate a fresh plan"
            exit 1
          }

      - name: Deploy Infrastructure
        id: deploy
        run: |
          set -euo pipefail

          echo "🚀 Deploying infrastructure to OCI Always Free Tier..."

          # Apply the validated plan
          ../../scripts/tg apply -auto-approve deploy.tfplan

          echo "✅ Deployment completed successfully"

          # Capture outputs for reporting
          ../../scripts/tg output -json > deployment_outputs.json

          # Generate OCI Console URL (if available)
          tenancy_ocid=$(jq -r '.tenancy_ocid.value // empty' deployment_outputs.json)
          if [ -n "$tenancy_ocid" ]; then
            echo "oci_console_url=https://cloud.oracle.com/?tenant=$tenancy_ocid" >> $GITHUB_OUTPUT
          fi

      - name: Verify Deployment
        run: |
          echo "🔍 Verifying deployed infrastructure..."

          # Check that all planned resources were created
          ../../scripts/tg state list

          # Validate infrastructure health (if health checks exist)
          if [ -f "../../scripts/health-check.sh" ]; then
            echo "🏥 Running infrastructure health checks..."
            ../../scripts/health-check.sh
          fi

      - name: Post-Deploy Summary
        run: |
          echo "## 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** OCI Always Free Tier (eu-madrid-1)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add resource summary
          resource_count=$(../../scripts/tg state list | wc -l)
          echo "**Resources Managed:** $resource_count" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add outputs (if any)
          if [ -s deployment_outputs.json ] && [ "$(jq 'keys | length' deployment_outputs.json)" -gt 0 ]; then
            echo "### 📋 Infrastructure Outputs" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            jq '.' deployment_outputs.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Save Deployment Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-results-${{ github.run_id }}
          path: |
            infrastructure/live/oci/eu-madrid-1/lab/deployment_outputs.json
            infrastructure/live/oci/eu-madrid-1/lab/*.log
          retention-days: 90

  notify-success:
    name: Deployment Success Notification
    runs-on: ubuntu-latest
    needs: [validate-and-plan, deploy-infrastructure]
    if: success()
    steps:
      - name: Success Summary
        run: |
          echo "## ✅ Infrastructure Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Zero Trust DevSecOps infrastructure has been successfully deployed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "- Verify infrastructure in OCI Console" >> $GITHUB_STEP_SUMMARY
          echo "- Run post-deployment tests" >> $GITHUB_STEP_SUMMARY
          echo "- Update documentation with new resources" >> $GITHUB_STEP_SUMMARY
