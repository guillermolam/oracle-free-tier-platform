name: docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "**/*.md"
      - "!**/CHANGELOG.md"
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "**/*.md"
      - "!**/CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: davidanson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .markdownlint-cli2.yaml
          globs: "docs/**/*.md README.md SECURITY.md CONTRIBUTING.md AGENTS.md infrastructure/**/*.md .github/**/*.md"
          no-ignore: true

  mermaid:
    name: Mermaid diagram validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run validate:mermaid

  threat-model:
    name: Threat-model corpus validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run test:threat-model
      - run: npm run validate:threat-model
