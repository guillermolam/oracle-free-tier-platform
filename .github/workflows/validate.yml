name: validate

on:
  pull_request:
    paths:
      - "infrastructure/**"
  push:
    branches: ["main"]
    paths:
      - "infrastructure/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tofu:
    name: OpenTofu fmt / validate / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.x"
          cache: true
      - name: fmt
        run: tofu fmt -check -recursive .
      - name: validate modules
        run: |
          set -euo pipefail
          for root in modules compositions; do
            [ -d "$root" ] || continue
            find "$root" -name main.tf -printf '%h\n' | sort -u | while read -r m; do
              echo "==> $m"
              (cd "$m" && tofu init -backend=false -input=false >/dev/null && tofu validate)
            done
          done
      - name: tofu test
        run: |
          set -euo pipefail
          find . -name '*.tftest.hcl' -printf '%h\n' | sort -u | while read -r d; do
            echo "==> $d"
            (cd "$d" && tofu init -backend=false -input=false >/dev/null && tofu test)
          done

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: "latest"
      - name: tflint init
        run: tflint --init
      - name: tflint recursive
        run: |
          if [ -n "$(find . -name '*.tf' | head -1)" ]; then
            tflint --recursive --format compact
          else
            echo "No OpenTofu files yet; skipping"
          fi

  checkov:
    name: Policy scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # v12.3115.0
        with:
          directory: infrastructure
          framework: terraform
          soft_fail: true
