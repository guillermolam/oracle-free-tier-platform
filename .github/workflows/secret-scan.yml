# Managed by repo-guardrails (guillermolam/dotfiles-backup) - local edits are overwritten.
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  TRUFFLEHOG_VERSION: 3.99.7

jobs:
  secrets:
    name: Secret scanning (gitleaks + trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install scanners (checksum-verified)
        run: .github/scripts/install-scanners.sh
      - name: gitleaks (full history)
        run: gitleaks git --redact --no-banner --config .gitleaks.toml
      - name: trufflehog (full history)
        run: .github/scripts/trufflehog-scan.sh history

  github-actions:
    name: GitHub Actions checks (fmt, lint, zizmor, outdated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fmt (yamlfmt), lint (actionlint), security (zizmor)
        run: |
          pipx install pre-commit
          rc=0
          for hook in detect-private-key yamlfmt actionlint zizmor; do
            pre-commit run --all-files --show-diff-on-failure "$hook" || rc=1
          done
          exit "$rc"
      - name: Outdated actions report (actions-up)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/actions-up-report.sh
