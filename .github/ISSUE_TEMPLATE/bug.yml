name: Bug
description: Report a defect in the platform, IaC, or tooling
title: "[Bug] "
labels: ["type/bug"]
body:
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - lab
        - staging
        - prod
        - tooling
    validations:
      required: true
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - network
        - compute
        - storage
        - identity
        - security
        - gitops
        - observability
        - hybrid
        - docs
        - ci/cd
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Redact anything sensitive.
